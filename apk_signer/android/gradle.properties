# 注意：本机构建的出口流量必须走本地代理 127.0.0.1:10808（直连外部被墙，
# JDK 默认不走系统代理），代理参数写在 jvmargs 里让 Gradle daemon 继承。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=10808 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=10808 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# 固定 Gradle 使用的 JDK（本机同时装有 JDK 8/11/17，自动探测可能挑到 JDK 8，
# 而 Gradle 9 要求 17+）
org.gradle.java.home=D\:\\Program Files\\Java\\jdk-17.0.20.1+1
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
